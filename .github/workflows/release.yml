name: Release

# Pushing a version tag (for example v1.0.0) builds the zip and uploads it to CurseForge,
# Wago, WoWInterface and GitHub Releases. Tags containing "alpha" or "beta" upload as test files.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      # A copy under a fixed name, so pullwise.gg can always link
      # releases/latest/download/Pullwise.zip without changing per version.
      - name: Attach Pullwise.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp .release/Pullwise-*.zip Pullwise.zip
          gh release upload "$GITHUB_REF_NAME" Pullwise.zip --clobber
